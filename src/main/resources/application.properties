spring.application.name=topaz-products-api

# Puerto fijo del backend (requerido por el flujo adb reverse del frontend)
server.port=8080

# Origen de datos externo (DummyJSON)
dummyjson.base-url=https://dummyjson.com

# Actuator (health)
management.endpoints.web.exposure.include=health,info

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
